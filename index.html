<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Planning UPC – lente 2027</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F1F2F4;
    --panel: #FFFFFF;
    --ink: #15171C;
    --muted: #6B7280;
    --faint: #9CA3AF;
    --line: #E3E5E9;
    --line-soft: #EFF0F2;
    --accent: #15171C;

    --b1: #1D4ED8;  --b1-soft: #DBE5FF;
    --b2: #C2410C;  --b2-soft: #FFE4D2;
    --exam: #6D28D9; --exam-soft: #EDE7FE;
    --free: #A16207; --free-soft: #FEF3C7;
    --era: #15803D; --era-soft: #DCFCE7;
    --mile-soft: #ECEEF1;

    --h-start: 7;
    --h-end: 20;
    --hours: 13;
    --radius: 14px;
    font-family: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-size: 15px; line-height: 1.4; font-variant-numeric: tabular-nums;
  }
  button { font: inherit; color: inherit; }
  :focus-visible { outline: 2.5px solid var(--b1); outline-offset: 2px; border-radius: 8px; }

  .app {
    height: 100vh; height: 100dvh;
    display: grid;
    grid-template-columns: 290px 1fr;
    grid-template-rows: auto 1fr;
    gap: 12px;
    padding: 12px;
  }

  /* ---------- top bar ---------- */
  .bar {
    grid-column: 1 / -1;
    display: flex; align-items: center; gap: 12px 20px; flex-wrap: wrap;
    background: var(--panel); border-radius: var(--radius); padding: 10px 14px 10px 20px;
  }
  .brand { font-weight: 800; font-size: 18px; letter-spacing: -0.01em; margin-right: 8px; white-space: nowrap; }
  .brand span { font-weight: 500; color: var(--muted); }
  .nav { display: flex; align-items: center; gap: 6px; }
  .icon-btn, .btn {
    height: 38px; border: 1px solid var(--line); background: var(--panel);
    border-radius: 10px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center;
  }
  .icon-btn { width: 38px; }
  .icon-btn svg { width: 18px; height: 18px; }
  .btn { padding: 0 14px; font-weight: 600; }
  .icon-btn:hover:not(:disabled), .btn:hover:not(:disabled) { background: var(--line-soft); }
  .icon-btn:disabled, .btn:disabled { opacity: .35; cursor: not-allowed; }
  .range { font-size: 20px; font-weight: 700; letter-spacing: -0.01em; white-space: nowrap; }
  .range small { font-size: 14px; font-weight: 500; color: var(--muted); margin-left: 8px; }
  .spacer { flex: 1; }
  .summary { color: var(--muted); white-space: nowrap; }
  .seg { display: inline-flex; background: var(--line-soft); border-radius: 10px; padding: 3px; }
  .seg button {
    border: 0; background: none; height: 32px; padding: 0 16px; border-radius: 8px;
    font-weight: 600; color: var(--muted); cursor: pointer;
  }
  .seg button[aria-pressed="true"] { background: var(--panel); color: var(--ink); box-shadow: 0 1px 2px rgba(21,23,28,.12); }

  /* ---------- sidebar ---------- */
  .short { display: none; }
  .side { display: flex; flex-direction: column; gap: 12px; min-height: 0; overflow-y: auto; }
  .card { background: var(--panel); border-radius: var(--radius); padding: 16px; }
  .card h2 { margin: 0 0 10px; font-size: 15px; font-weight: 700; }

  .mini-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .mini-head h2 { margin: 0; }
  .mini-head .icon-btn { width: 30px; height: 30px; border: 0; }
  .mini { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; text-align: center; font-size: 13px; }
  .mini .dh { color: var(--faint); font-size: 12px; padding-bottom: 4px; }
  .mini button {
    border: 0; background: none; cursor: pointer; aspect-ratio: 1; border-radius: 8px;
    position: relative; font-weight: 500;
  }
  .mini button:hover:not(:disabled) { background: var(--line-soft); }
  .mini button.other { color: var(--faint); }
  .mini button.sel { background: var(--line-soft); }
  .mini button.cur { background: var(--ink); color: #fff; }
  .mini button:disabled { color: #D1D5DB; cursor: default; }
  .mini .dots { position: absolute; left: 0; right: 0; bottom: 3px; display: flex; justify-content: center; gap: 2px; }
  .mini .dots i { width: 4px; height: 4px; border-radius: 50%; }

  .course { display: grid; grid-template-columns: 6px 1fr; gap: 12px; padding: 10px 0; }
  .course + .course { border-top: 1px solid var(--line-soft); }
  .course .swatch { border-radius: 3px; }
  .course h3 { margin: 0; font-size: 15px; font-weight: 700; line-height: 1.25; }
  .course .meta { color: var(--muted); font-size: 13px; margin: 2px 0 6px; }
  .course ul { list-style: none; margin: 0; padding: 0; font-size: 13px; }
  .course li { display: flex; justify-content: space-between; gap: 8px; }

  .dates { list-style: none; margin: 0; padding: 0; font-size: 13px; }
  .dates li { display: grid; grid-template-columns: 88px 1fr; gap: 8px; padding: 5px 0; }
  .dates li + li { border-top: 1px solid var(--line-soft); }
  .dates time { color: var(--muted); }
  .dates button { all: unset; cursor: pointer; }
  .dates button:hover { text-decoration: underline; text-underline-offset: 2px; }
  .dates .k { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 6px; transform: translateY(-1px); }

  /* ---------- main board ---------- */
  .board { background: var(--panel); border-radius: var(--radius); min-height: 0; min-width: 0; overflow: auto; display: flex; flex-direction: column; }

  /* week */
  .wk {
    flex: 1; display: grid;
    grid-template-columns: 58px repeat(5, minmax(110px, 1fr));
    grid-template-rows: auto auto minmax(calc(var(--hours) * 40px), 1fr);
    min-width: 620px;
  }
  .wk-h {
    position: sticky; top: 0; z-index: 4; background: var(--panel);
    padding: 12px 12px 8px; border-left: 1px solid var(--line-soft);
  }
  .wk-h:first-child { border-left: 0; }
  .wk-h .d { color: var(--muted); font-size: 13px; font-weight: 500; }
  .wk-h .n { font-size: 24px; font-weight: 800; line-height: 1.1; letter-spacing: -0.02em; }
  .wk-h .n span { font-size: 14px; font-weight: 500; color: var(--muted); margin-left: 4px; letter-spacing: 0; }
  .wk-h.today .n { color: var(--b1); }
  .wk-h.out .n, .wk-h.out .d { color: var(--faint); }

  .ad {
    border-left: 1px solid var(--line-soft); border-bottom: 1px solid var(--line);
    padding: 0 6px 8px; display: flex; flex-direction: column; gap: 4px; min-height: 12px;
  }
  .ad:first-child { border-left: 0; }
  .tag { font-size: 12px; font-weight: 600; padding: 3px 8px; border-radius: 6px; line-height: 1.3; }
  .tag.exam { background: var(--exam-soft); color: var(--exam); }
  .tag.free { background: var(--free-soft); color: var(--free); }
  .tag.era  { background: var(--era-soft); color: var(--era); }
  .tag.mile { background: var(--mile-soft); color: var(--ink); }

  .times { position: relative; }
  .times span {
    position: absolute; right: 8px; font-size: 12px; color: var(--muted);
    transform: translateY(-50%);
  }
  .times span:first-child { transform: translateY(2px); }
  .times span.last { transform: translateY(-100%); }
  .col {
    position: relative; border-left: 1px solid var(--line-soft);
    background-image: linear-gradient(to bottom, var(--line-soft) 1px, transparent 1px);
    background-size: 100% calc(100% / var(--hours));
  }
  .col.free-day, .col.out {
    background-image:
      linear-gradient(to bottom, var(--line-soft) 1px, transparent 1px),
      repeating-linear-gradient(135deg, transparent 0 8px, rgba(161,98,7,.08) 8px 10px);
    background-size: 100% calc(100% / var(--hours)), auto;
  }
  .col.out {
    background-image:
      linear-gradient(to bottom, var(--line-soft) 1px, transparent 1px),
      repeating-linear-gradient(135deg, transparent 0 8px, rgba(21,23,28,.05) 8px 10px);
  }
  .col.today { background-color: #F7F9FF; }

  .ev {
    position: absolute; left: 4px; right: 4px;
    border-radius: 10px; padding: 8px 10px; color: #fff; overflow: hidden;
    display: flex; flex-direction: column; gap: 2px; line-height: 1.25;
  }
  .ev.b1 { background: var(--b1); }
  .ev.b2 { background: var(--b2); }
  .ev .t { font-size: 13px; font-weight: 600; opacity: .9; }
  .ev .name { font-size: 15px; font-weight: 700; }
  .ev .sub { font-size: 13px; opacity: .85; }

  .now { position: absolute; left: 0; right: 0; height: 2px; background: #DC2626; z-index: 3; }
  .now::before { content: ""; position: absolute; left: -4px; top: -3px; width: 8px; height: 8px; border-radius: 50%; background: #DC2626; }

  .empty-note {
    grid-column: 2 / -1; grid-row: 3; align-self: center; justify-self: center;
    z-index: 2; background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
    padding: 12px 16px; color: var(--muted); max-width: 40ch; text-align: center;
  }
  .empty-note button { border: 0; background: none; padding: 0; color: var(--b1); font-weight: 600; cursor: pointer; }

  /* month */
  .mo {
    flex: 1; display: grid;
    grid-template-columns: repeat(5, minmax(0, 1fr)) repeat(2, minmax(0, .55fr));
    grid-template-rows: auto;
    grid-auto-rows: minmax(92px, 1fr);
    min-width: 560px;
  }
  .mo-h { padding: 12px 10px 8px; font-size: 13px; color: var(--muted); font-weight: 500; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--panel); z-index: 2; }
  .cell {
    border: 0; border-left: 1px solid var(--line-soft); border-top: 1px solid var(--line-soft);
    background: none; text-align: left; padding: 6px; cursor: pointer;
    display: flex; flex-direction: column; gap: 3px; min-width: 0; overflow: hidden;
  }
  .cell:nth-child(7n + 1) { border-left: 0; }
  .cell:hover:not(:disabled) { background: #FAFAFB; }
  .cell .n { font-weight: 700; font-size: 14px; padding: 1px 6px; align-self: flex-start; border-radius: 7px; }
  .cell.other .n { color: var(--faint); font-weight: 500; }
  .cell.other > :not(.n) { opacity: .5; }
  .cell.today .n { background: var(--b1); color: #fff; }
  .cell.weekend { background: #FBFBFC; }
  .cell:disabled { cursor: default; background: repeating-linear-gradient(135deg, transparent 0 8px, rgba(21,23,28,.04) 8px 10px); }
  .cell:disabled .n { color: #D1D5DB; }
  .chip {
    display: flex; gap: 6px; align-items: baseline; font-size: 12px; font-weight: 600;
    padding: 3px 7px; border-radius: 6px; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .chip.b1 { background: var(--b1); }
  .chip.b2 { background: var(--b2); }
  .chip b { font-weight: 500; opacity: .85; }
  .cell .tag { font-size: 11px; padding: 2px 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* ---------- responsive ---------- */
  @media (min-width: 1800px) {
    body { font-size: 17px; }
    .app { grid-template-columns: 340px 1fr; gap: 16px; padding: 16px; }
    .brand { font-size: 21px; }
    .range { font-size: 24px; }
    .card h2 { font-size: 17px; }
    .course h3 { font-size: 17px; }
    .course .meta, .course ul, .dates, .mini { font-size: 15px; }
    .wk { grid-template-columns: 70px repeat(5, minmax(110px, 1fr)); }
    .wk-h { padding: 16px 16px 10px; }
    .wk-h .d { font-size: 15px; }
    .wk-h .n { font-size: 30px; }
    .tag { font-size: 14px; }
    .times span { font-size: 14px; right: 12px; }
    .ev { padding: 12px 14px; left: 6px; right: 6px; border-radius: 12px; }
    .ev .t { font-size: 15px; }
    .ev .name { font-size: 19px; }
    .ev .sub { font-size: 15px; }
    .mo-h { font-size: 15px; padding: 14px 12px 10px; }
    .cell { padding: 8px; gap: 5px; }
    .cell .n { font-size: 16px; }
    .chip { font-size: 14px; padding: 4px 9px; }
    .cell .tag { font-size: 13px; }
  }
  @media (max-width: 1100px) {
    .app { grid-template-columns: 1fr; grid-template-rows: auto 1fr auto; height: auto; min-height: 100dvh; }
    .board { order: 2; }
    .side { order: 3; }
    .board { min-height: calc(100dvh - 140px); }
    .side { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); overflow: visible; }
  }
  @media (max-width: 700px) {
    .app { padding: 8px; gap: 8px; }
    .bar { padding: 10px 12px; gap: 10px; }
    .brand { width: 100%; }
    .range { font-size: 17px; order: 5; width: 100%; }
    .summary { display: none; }
    .spacer { display: none; }
    .wk { min-width: 0; grid-template-columns: 40px repeat(5, minmax(0, 1fr)); }
    .wk-h { padding: 8px 4px 6px; text-align: center; }
    .wk-h .n { font-size: 18px; }
    .wk-h .n span { display: none; }
    .long { display: none; }
    .short { display: inline; }
    .ad { padding: 0 2px 6px; }
    .tag { font-size: 10px; padding: 2px 4px; }
    .ev { left: 2px; right: 2px; padding: 5px; }
    .ev .name { font-size: 12px; }
    .ev .t { font-size: 11px; }
    .ev .sub { display: none; }
    .times span { right: 4px; font-size: 10px; }
    .mo { min-width: 0; grid-auto-rows: minmax(68px, 1fr); }
    .cell { padding: 3px; }
    .cell .tag { display: none; }
    .chip { padding: 2px 4px; font-size: 10px; }
    .chip b { display: none; }
  }
</style>
</head>
<body>
<div class="app">

  <header class="bar">
    <div class="brand">Planning UPC <span>ESEIAAT, lente 2027</span></div>
    <div class="nav">
      <button class="icon-btn" id="prev" type="button" aria-label="Vorige">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
      <button class="icon-btn" id="next" type="button" aria-label="Volgende">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>
      </button>
      <button class="btn" id="home" type="button"></button>
    </div>
    <div class="range" id="range"></div>
    <div class="spacer"></div>
    <div class="summary" id="summary"></div>
    <div class="seg" role="group" aria-label="Weergave">
      <button type="button" data-view="week">Week</button>
      <button type="button" data-view="month">Maand</button>
    </div>
  </header>

  <aside class="side">
    <section class="card">
      <div class="mini-head">
        <h2 id="miniTitle"></h2>
        <div>
          <button class="icon-btn" id="miniPrev" type="button" aria-label="Vorige maand">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
          </button>
          <button class="icon-btn" id="miniNext" type="button" aria-label="Volgende maand">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>
          </button>
        </div>
      </div>
      <div class="mini" id="mini"></div>
    </section>

    <section class="card">
      <h2>Vakken</h2>
      <div id="courses"></div>
    </section>

    <section class="card">
      <h2>Belangrijke data</h2>
      <ul class="dates" id="dates"></ul>
    </section>
  </aside>

  <main class="board" id="board" aria-live="polite"></main>
</div>

<script>
/* =========================================================
   DATA: pas hier vakken en kalender aan.
   day: 1 = maandag … 5 = vrijdag
   ========================================================= */
const COURSES = [
  {
    id: "b1", code: "205241", name: "Autonomous vehicle programming", short: "AVP",
    period: "B1", from: "2027-02-22", to: "2027-04-12",
    sessions: [
      { day: 1, start: "10:00", end: "12:00", type: "theorie", group: 1 },
      { day: 3, start: "16:00", end: "19:00", type: "theorie", group: 1 }
    ]
  },
  {
    id: "b2", code: "205203", name: "Introduction to Rockets", short: "Rockets",
    period: "B2", from: "2027-04-22", to: "2027-06-04",
    sessions: [
      { day: 1, start: "18:00", end: "20:00", type: "theorie", group: 1 },
      { day: 4, start: "17:00", end: "20:00", type: "theorie", group: 1 }
    ]
  }
];

// Lesvrije dagen volgens de ESEIAAT-kalender
const NO_CLASS = [
  ["2027-03-22", "2027-03-29"],
  ["2027-05-13", "2027-05-14"]
];

// kind: exam | free | era | mile
const MARKS = [
  { from: "2027-02-08", to: "2027-02-12", label: "Introductiecursussen", kind: "mile" },
  { from: "2027-02-15", to: "2027-02-15", label: "Start Erasmus en lessen", kind: "era" },
  { from: "2027-02-22", to: "2027-02-22", label: "Start B1", kind: "mile" },
  { from: "2027-03-22", to: "2027-03-29", label: "Paasvakantie", kind: "free" },
  { from: "2027-04-12", to: "2027-04-12", label: "Laatste les B1", kind: "mile" },
  { from: "2027-04-13", to: "2027-04-21", label: "Tussentijdse examens", kind: "exam" },
  { from: "2027-04-22", to: "2027-04-22", label: "Start B2", kind: "mile" },
  { from: "2027-05-13", to: "2027-05-13", label: "Campus Day, geen les", kind: "free" },
  { from: "2027-05-14", to: "2027-05-14", label: "Geen les", kind: "free" },
  { from: "2027-06-04", to: "2027-06-04", label: "Laatste lesdag", kind: "mile" },
  { from: "2027-06-07", to: "2027-06-18", label: "Eindexamens", kind: "exam" },
  { from: "2027-06-15", to: "2027-06-15", label: "Einde Erasmus", kind: "era" },
  { from: "2027-06-21", to: "2027-06-21", label: "Herkansing bimestervakken", kind: "exam" },
  { from: "2027-06-24", to: "2027-06-24", label: "Sint-Jan, feestdag", kind: "free" },
  { from: "2027-06-25", to: "2027-06-25", label: "Punten op Atenea", kind: "mile" }
];

const RANGE = { from: "2027-02-01", to: "2027-06-30" };
const H_START = 7, H_END = 20;

/* ========================================================= */
const DAY_LONG = ["zondag", "maandag", "dinsdag", "woensdag", "donderdag", "vrijdag", "zaterdag"];
const MONTHS = ["januari", "februari", "maart", "april", "mei", "juni", "juli", "augustus", "september", "oktober", "november", "december"];
const MON_S = ["jan", "feb", "mrt", "apr", "mei", "jun", "jul", "aug", "sep", "okt", "nov", "dec"];
const KIND_COLOR = { exam: "var(--exam)", free: "#EAB308", era: "var(--era)", mile: "var(--faint)" };

const D = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
const key = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
const add = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);
const monday = d => add(d, -((d.getDay() + 6) % 7));
const between = (d, a, b) => key(d) >= a && key(d) <= b;
const mins = t => { const [h, m] = t.split(":").map(Number); return h * 60 + m; };
const isWeekend = d => d.getDay() === 0 || d.getDay() === 6;
const cap = s => s[0].toUpperCase() + s.slice(1);
const isoWeek = d => {
  const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  const day = t.getUTCDay() || 7; t.setUTCDate(t.getUTCDate() + 4 - day);
  return Math.ceil(((t - new Date(Date.UTC(t.getUTCFullYear(), 0, 1))) / 864e5 + 1) / 7);
};
const hoursTxt = m => { const h = m / 60; return `${Number.isInteger(h) ? h : h.toFixed(1).replace(".", ",")} uur`; };

const R0 = D(RANGE.from), R1 = D(RANGE.to);
const W_MIN = monday(R0), W_MAX = monday(R1);
const M_MIN = R0.getMonth(), M_MAX = R1.getMonth(), YEAR = R0.getFullYear();
const inRange = d => between(d, RANGE.from, RANGE.to);
const noClass = d => NO_CLASS.some(([a, b]) => between(d, a, b));

function lessons(d) {
  if (!inRange(d) || noClass(d)) return [];
  const out = [];
  COURSES.forEach(c => {
    if (!between(d, c.from, c.to)) return;
    c.sessions.forEach(s => { if (s.day === d.getDay()) out.push({ c, s }); });
  });
  return out.sort((a, b) => mins(a.s.start) - mins(b.s.start));
}
const marks = d => MARKS.filter(m => between(d, m.from, m.to) && !(isWeekend(d) && m.from !== m.to));
function nextLesson(after) {
  for (let d = add(after, 1); d <= R1; d = add(d, 1)) { const l = lessons(d); if (l.length) return { d, l: l[0] }; }
  return null;
}
function tally(days) {
  let n = 0, m = 0;
  days.forEach(d => lessons(d).forEach(({ s }) => { n++; m += mins(s.end) - mins(s.start); }));
  return n ? `${n} ${n === 1 ? "les" : "lessen"}, ${hoursTxt(m)}` : "Geen lessen";
}

/* ---------- state ---------- */
const TODAY = new Date(); TODAY.setHours(0, 0, 0, 0);
const TODAY_IN = inRange(TODAY);
const HOME = TODAY_IN ? TODAY : D("2027-02-22");
let view = "week", cursor = HOME, miniMonth = HOME.getMonth();
try {
  const s = JSON.parse(localStorage.getItem("planning-upc") || "null");
  if (s && (s.view === "week" || s.view === "month")) { view = s.view; const c = D(s.cursor); if (inRange(c)) cursor = c; }
} catch (e) {}
miniMonth = cursor.getMonth();
const persist = () => { try { localStorage.setItem("planning-upc", JSON.stringify({ view, cursor: key(cursor) })); } catch (e) {} };

const firstWorkday = m => { let d = new Date(YEAR, m, 1); while (isWeekend(d)) d = add(d, 1); return d; };

function go(dir) {
  if (view === "week") {
    let w = add(monday(cursor), 7 * dir);
    if (w < W_MIN) w = W_MIN; if (w > W_MAX) w = W_MAX;
    cursor = w < R0 ? R0 : w;
  } else {
    const m = Math.max(M_MIN, Math.min(M_MAX, cursor.getMonth() + dir));
    cursor = firstWorkday(m);
  }
  miniMonth = cursor.getMonth();
  render();
}
function jump(d, v) {
  if (d < R0) d = R0; if (d > R1) d = R1;
  cursor = d; if (v) view = v; miniMonth = cursor.getMonth();
  render();
}

/* ---------- week ---------- */
const board = document.getElementById("board");
const HOURS = H_END - H_START;
const pctOf = m => (m / 60 - H_START) / HOURS * 100;

function renderWeek() {
  const mon = monday(cursor);
  const days = [0, 1, 2, 3, 4].map(i => add(mon, i));
  const fri = days[4];
  const same = mon.getMonth() === fri.getMonth();
  document.getElementById("range").innerHTML =
    `${mon.getDate()}${same ? "" : " " + MONTHS[mon.getMonth()]} – ${fri.getDate()} ${MONTHS[fri.getMonth()]} ${fri.getFullYear()}<small>week ${isoWeek(mon)}</small>`;
  document.getElementById("summary").textContent = tally(days);

  let h = `<div class="wk"><div class="wk-h"></div>`;
  days.forEach(d => {
    const cls = [!inRange(d) && "out", key(d) === key(TODAY) && "today"].filter(Boolean).join(" ");
    h += `<div class="wk-h ${cls}"><div class="d"><span class="long">${DAY_LONG[d.getDay()]}</span><span class="short">${DAY_LONG[d.getDay()].slice(0, 2)}</span></div><div class="n">${d.getDate()}<span>${MON_S[d.getMonth()]}</span></div></div>`;
  });
  h += `<div class="ad"></div>`;
  days.forEach(d => { h += `<div class="ad">${marks(d).map(m => `<span class="tag ${m.kind}">${m.label}</span>`).join("")}</div>`; });

  h += `<div class="times">`;
  for (let t = H_START; t <= H_END; t++) h += `<span class="${t === H_END ? "last" : ""}" style="top:${(t - H_START) / HOURS * 100}%">${String(t).padStart(2, "0")}:00</span>`;
  h += `</div>`;

  let any = false;
  days.forEach(d => {
    const cls = ["col", !inRange(d) && "out", inRange(d) && noClass(d) && "free-day", key(d) === key(TODAY) && "today"].filter(Boolean).join(" ");
    h += `<div class="${cls}">`;
    lessons(d).forEach(({ c, s }) => {
      any = true;
      const top = pctOf(mins(s.start)), bottom = pctOf(mins(s.end));
      h += `<div class="ev ${c.id}" style="top:calc(${top}% + 2px);height:calc(${bottom - top}% - 4px)" title="${c.code} ${c.name}, ${s.start} tot ${s.end}">
        <span class="t"><span class="long">${s.start} – ${s.end}</span><span class="short">${s.start}</span></span>
        <span class="name"><span class="long">${c.name}</span><span class="short">${c.short}</span></span>
        <span class="sub">${c.code}, ${s.type} groep ${s.group}</span>
      </div>`;
    });
    if (key(d) === key(TODAY)) {
      const n = new Date(); const m = n.getHours() * 60 + n.getMinutes();
      if (m >= H_START * 60 && m <= H_END * 60) h += `<div class="now" style="top:${pctOf(m)}%"></div>`;
    }
    h += `</div>`;
  });

  if (!any) {
    const nx = nextLesson(fri);
    h += `<div class="empty-note">${nx
      ? `Geen lessen deze week. Volgende les: ${nx.l.c.short} op ${DAY_LONG[nx.d.getDay()]} ${nx.d.getDate()} ${MONTHS[nx.d.getMonth()]}. <button type="button" id="toNext">Ga naar die week</button>`
      : `Geen lessen meer dit semester.`}</div>`;
    h += `</div>`;
    board.innerHTML = h;
    const b = document.getElementById("toNext"); if (b) b.onclick = () => jump(nx.d);
  } else {
    h += `</div>`;
    board.innerHTML = h;
  }
}

/* ---------- month ---------- */
function renderMonth() {
  const m = cursor.getMonth();
  const first = new Date(YEAR, m, 1), last = new Date(YEAR, m + 1, 0);
  document.getElementById("range").innerHTML = `${cap(MONTHS[m])} ${YEAR}`;
  const all = []; for (let d = first; d <= last; d = add(d, 1)) all.push(d);
  document.getElementById("summary").textContent = tally(all);

  let h = `<div class="mo">`;
  ["ma", "di", "wo", "do", "vr", "za", "zo"].forEach(n => h += `<div class="mo-h">${n}</div>`);
  for (let d = monday(first); d <= add(monday(last), 6); d = add(d, 1)) {
    const ok = inRange(d);
    const cls = ["cell", d.getMonth() !== m && "other", isWeekend(d) && "weekend", key(d) === key(TODAY) && "today"].filter(Boolean).join(" ");
    let inner = `<span class="n">${d.getDate()}</span>`;
    if (ok) {
      marks(d).forEach(mk => inner += `<span class="tag ${mk.kind}">${mk.label}</span>`);
      lessons(d).forEach(({ c, s }) => inner += `<span class="chip ${c.id}">${s.start}<b>${c.short}</b></span>`);
    }
    h += `<button type="button" class="${cls}" data-d="${key(d)}" ${ok ? "" : "disabled"} aria-label="${DAY_LONG[d.getDay()]} ${d.getDate()} ${MONTHS[d.getMonth()]}">${inner}</button>`;
  }
  h += `</div>`;
  board.innerHTML = h;
  board.querySelectorAll(".cell:not(:disabled)").forEach(b => b.onclick = () => jump(D(b.dataset.d), "week"));
}

/* ---------- sidebar ---------- */
function renderMini() {
  document.getElementById("miniTitle").textContent = `${cap(MONTHS[miniMonth])} ${YEAR}`;
  document.getElementById("miniPrev").disabled = miniMonth <= M_MIN;
  document.getElementById("miniNext").disabled = miniMonth >= M_MAX;
  const first = new Date(YEAR, miniMonth, 1), last = new Date(YEAR, miniMonth + 1, 0);
  const selMon = key(monday(cursor));
  let h = ["ma", "di", "wo", "do", "vr", "za", "zo"].map(n => `<span class="dh">${n}</span>`).join("");
  for (let d = monday(first); d <= add(monday(last), 6); d = add(d, 1)) {
    const ok = inRange(d);
    const inSel = view === "week" ? key(monday(d)) === selMon : d.getMonth() === cursor.getMonth();
    const cls = [d.getMonth() !== miniMonth && "other", inSel && "sel", key(d) === key(cursor) && view === "week" && "cur"].filter(Boolean).join(" ");
    const dots = ok ? lessons(d).map(({ c }) => `<i style="background:var(--${c.id})"></i>`).join("") : "";
    h += `<button type="button" class="${cls}" data-d="${key(d)}" ${ok ? "" : "disabled"}>${d.getDate()}<span class="dots">${dots}</span></button>`;
  }
  const el = document.getElementById("mini");
  el.innerHTML = h;
  el.querySelectorAll("button:not(:disabled)").forEach(b => b.onclick = () => jump(D(b.dataset.d), "week"));
}

function renderSideStatic() {
  document.getElementById("courses").innerHTML = COURSES.map(c => {
    let n = 0, m = 0;
    for (let d = D(c.from); d <= D(c.to); d = add(d, 1)) lessons(d).forEach(x => { if (x.c === c) { n++; m += mins(x.s.end) - mins(x.s.start); } });
    const a = D(c.from), z = D(c.to);
    return `<div class="course">
      <span class="swatch" style="background:var(--${c.id})"></span>
      <div>
        <h3>${c.name}</h3>
        <div class="meta">${c.code}, ${c.period} van ${a.getDate()} ${MON_S[a.getMonth()]} tot ${z.getDate()} ${MON_S[z.getMonth()]}<br>${n} lessen, ${hoursTxt(m)} in totaal</div>
        <ul>${c.sessions.map(s => `<li><span>${cap(DAY_LONG[s.day])}</span><span>${s.start} – ${s.end}</span></li>`).join("")}</ul>
      </div>
    </div>`;
  }).join("");

  document.getElementById("dates").innerHTML = MARKS.map(m => {
    const a = D(m.from), z = D(m.to);
    const when = m.from === m.to ? `${a.getDate()} ${MON_S[a.getMonth()]}` : `${a.getDate()}–${z.getDate()} ${MON_S[z.getMonth()]}`;
    return `<li><time>${when}</time><button type="button" data-d="${m.from}"><span class="k" style="background:${KIND_COLOR[m.kind]}"></span>${m.label}</button></li>`;
  }).join("");
  document.querySelectorAll("#dates button").forEach(b => b.onclick = () => jump(D(b.dataset.d), "week"));
}

/* ---------- render ---------- */
const prev = document.getElementById("prev"), next = document.getElementById("next"), home = document.getElementById("home");
home.textContent = TODAY_IN ? "Vandaag" : "Eerste lesweek";

function render() {
  document.querySelectorAll(".seg button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.view === view)));
  if (view === "week") {
    renderWeek();
    prev.disabled = monday(cursor) <= W_MIN; next.disabled = monday(cursor) >= W_MAX;
    prev.setAttribute("aria-label", "Vorige week"); next.setAttribute("aria-label", "Volgende week");
  } else {
    renderMonth();
    prev.disabled = cursor.getMonth() <= M_MIN; next.disabled = cursor.getMonth() >= M_MAX;
    prev.setAttribute("aria-label", "Vorige maand"); next.setAttribute("aria-label", "Volgende maand");
  }
  renderMini();
  persist();
}

document.querySelectorAll(".seg button").forEach(b => b.onclick = () => { view = b.dataset.view; render(); });
prev.onclick = () => go(-1);
next.onclick = () => go(1);
home.onclick = () => jump(HOME);
document.getElementById("miniPrev").onclick = () => { miniMonth = Math.max(M_MIN, miniMonth - 1); renderMini(); };
document.getElementById("miniNext").onclick = () => { miniMonth = Math.min(M_MAX, miniMonth + 1); renderMini(); };
document.addEventListener("keydown", e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === "ArrowLeft") { e.preventDefault(); go(-1); }
  else if (e.key === "ArrowRight") { e.preventDefault(); go(1); }
  else if (e.key === "w" || e.key === "W") { view = "week"; render(); }
  else if (e.key === "m" || e.key === "M") { view = "month"; render(); }
});

renderSideStatic();
render();
</script>
</body>
</html>
